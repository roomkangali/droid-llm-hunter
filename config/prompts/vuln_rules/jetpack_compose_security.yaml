name: "Jetpack Compose Security"
description: "Detects potential security issues in Jetpack Compose code."
prompt: |
  Analyze the following decompiled Android code (Java or Smali) for security best practices in Jetpack Compose.
  Specifically, look for Composable functions that might be vulnerable to screen capture.
  Check if `FLAG_SECURE` is used to prevent screen content from being captured.

  Not vulnerable if the screen displays no sensitive data (no payment details, documents,
  credentials, or OTP) — missing `FLAG_SECURE` is only a real gap on a screen that actually shows
  something worth protecting from screenshots/screen-recording.

  Code:
  ```
  {code_snippet}
  ```

  Context:
  - File Path: {file_path}

  Is there a potential security issue in this Jetpack Compose code? If yes, explain the risk and suggest a remediation.
tags: ["compose", "ui", "security"]
detection_pattern: "@Composable"
